<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>夜行小隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：接近正上方俯視的夜雨城鎮全螢幕；左上方向箭頭、距離與四名隊員狀態，上方警示，左下推桿；單一深色主題 */
:root{
  --bg:#050607; --panel:rgba(6,8,9,.8); --line:rgba(170,185,160,.32); --fg:#ffffff; --mut:#c3cad6;
  --amber:#ffb23e; --red:#ff4d3d; --green:#6fdc8c; --cyan:#5fe3ff; --orange:#ff7a3d;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:700;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#05070b;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none}
#tl{top:10px;left:12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:5px;min-width:210px;max-width:calc(100% - 100px)}
#tl .row{display:flex;align-items:center;gap:8px;font-size:15px}
.track{flex:1;height:9px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden;min-width:80px}
.track b{display:block;height:100%;width:100%;background:var(--green)}
.track b.mid{background:var(--amber)} .track b.low{background:var(--red)}
.track.pg b{background:#fff;width:0}
[hidden]{display:none!important}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#nav{position:absolute;top:62px;right:12px;width:176px;background:rgba(6,8,9,.86);border:1px solid var(--line);border-radius:8px;overflow:hidden;pointer-events:none}
#map{display:block;width:176px;height:150px}
#navT{display:flex;align-items:center;gap:8px;padding:7px 9px;border-top:1px solid var(--line)}
#navI{width:38px;height:38px;flex:none;transform-origin:50% 50%}
#navT div{display:flex;flex-direction:column;line-height:1.25;min-width:0}
#navA{font-size:19px;font-weight:900;color:#fff;white-space:nowrap}
#navD{font-size:13px;color:#cfd6df;white-space:pre-line}
#nav.off #navA{color:var(--amber)}
#acts{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-end}
.act{--p:0;width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;background:conic-gradient(rgba(255,255,255,.28) calc(var(--p)*1turn),rgba(8,10,12,.66) 0)}
.act b{font-size:19px;font-weight:900;line-height:1.1}.act span{font-size:13px;color:#d6dde6;font-weight:700}
.act.on{border-color:var(--green)}.act.on span{color:var(--green)}
.act.cd{border-color:rgba(255,255,255,.35)}.act.cd b{color:#aab2bd}
.act.hot{border-color:var(--red);background:rgba(140,24,16,.72)}.act.hot span{color:#fff;font-size:15px;font-weight:900}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid #ff4d3d;border-radius:2px}
.mk i{position:absolute;top:31px;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;font-weight:900;white-space:nowrap;color:#ff7a6a;text-shadow:0 1px 0 #000,0 0 6px #000}
.mk.fb{border:2px dashed #e8f4ff}.mk.fb i{color:#e8f4ff}
#mems{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:14px;white-space:nowrap}
#mems .track{height:10px}
.track.rc b{background:#eaf2ff;width:0}
#recB{color:#eaf2ff}
#cov{font-size:14px;color:var(--mut)}
#cov.in{color:var(--cyan)} #cov.tr{color:var(--green)}
#pauseB,#skipB{position:absolute;top:10px;right:12px;min-width:64px;min-height:44px;font-size:16px;font-weight:900;color:#fff;background:var(--panel);border:1px solid var(--line);border-radius:6px}
#warn{top:19%;left:8px;right:8px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:900;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9)}
#warn.red{color:var(--red)} #warn.amb{color:var(--amber)} #warn.org{color:var(--orange)} #warn.grn{color:var(--green)} #warn.cyn{color:var(--cyan)}
#seg{top:30%;left:8px;right:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9)}
#seg b{font-size:clamp(28px,6vw,46px);font-weight:900;padding:2px 18px;background:rgba(8,11,18,.55);border-radius:6px}
#seg span{font-size:clamp(16px,3.2vw,21px);color:#eef1f6;max-width:560px;line-height:1.5}
#joy{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(8,11,18,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9)}
#joyT{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:13px;color:var(--mut);pointer-events:none}
#legend{right:12px;top:290px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;max-width:46%}
#legend i{font-style:normal;font-weight:900}
.ov{position:absolute;inset:0;background:rgba(4,6,10,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{width:min(100%,640px);max-height:100%;overflow-y:auto;background:#121620;border:1px solid #333b4a;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:36px;font-weight:900;line-height:1.15}
.card h2{margin:0;font-size:27px;font-weight:900;line-height:1.25}
.card .tag{font-size:14px;color:var(--amber);letter-spacing:.1em}
.card p{margin:0;font-size:17px;line-height:1.65}
.card .mut{color:var(--mut);font-size:14px}
.how{margin:0;padding:10px 12px 10px 30px;background:#1d2330;border-radius:8px;display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.55}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;min-height:56px;font-size:18px;font-weight:900;color:#111;background:#fff;border:2px solid #fff;border-radius:8px}
.btn.dark{color:#fff;background:transparent;border-color:#555e70}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:#1d2330;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stats span{font-size:13px;color:var(--mut)}
.stats b{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}
.lesson{background:rgba(111,220,140,.1);border:1px solid rgba(111,220,140,.45);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.6}
.know{border-top:1px solid #333b4a;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.know b{font-size:13px;color:var(--amber);letter-spacing:.08em}
.know p{font-size:15px}
.know a{font-size:12px;font-weight:500;color:var(--mut);line-height:1.5;word-break:break-word}
.tbl{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:1px;background:#333b4a;border-radius:8px;overflow:hidden;font-size:14px}
.tbl div{background:#1d2330;padding:6px 8px;text-align:center}
.tbl div.h{background:#262e3e;font-weight:900}
.y{color:var(--green)} .n{color:var(--red)}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:18px;line-height:1.6;background:#111;z-index:9}
@media (orientation:portrait){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}#legend{display:none}#mems{grid-template-columns:auto 1fr auto 1fr}#mems .track{min-width:30px}#acts{flex-direction:column-reverse!important}#tl{min-width:0;width:calc(100% - 158px)}#warn{top:252px}#seg{top:300px}#nav{width:128px}#map{width:128px;height:104px}#navT{padding:6px 7px;gap:6px}#navI{width:30px;height:30px}#navA{font-size:16px}#navD{font-size:12px}}

/* 推桿：左半邊任一處按住即可，手指拖出圈外時圈會跟著走 */
#joyZone{position:absolute;left:0;top:0;bottom:0;width:50%;touch-action:none;z-index:1}
#joy{pointer-events:none;z-index:2;opacity:.6;transition:opacity .15s}
#joy.act0{opacity:1}
#acts{z-index:3}
.act{position:relative}.kb{display:none;position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:900;color:#e8edf2;background:rgba(6,8,9,.8);padding:1px 6px;border-radius:4px;white-space:nowrap}
@media (pointer:fine){.kb{display:block}#acts{bottom:calc(30px + env(safe-area-inset-bottom,0px))}#joyT::after{content:'（或 W A S D）'}}
@media (orientation:landscape) and (max-height:599px){#legend{display:none!important}}
/* 手機橫放（畫面矮）：全部縮小，避免重疊 */
@media (orientation:landscape) and (max-height:480px){
 #tl{top:6px;left:8px;padding:5px 8px;gap:3px;min-width:0;width:236px}
 #tl .row{font-size:12px;gap:6px}
 #tl .track{height:6px;min-width:30px}
 #mems{grid-template-columns:auto 1fr auto 1fr;font-size:12px;gap:3px 6px}
 #mems .track{height:7px}
 #cov{font-size:12px}
 #pauseB,#skipB{top:6px;right:8px;min-height:38px;min-width:56px;font-size:14px}
 #nav{top:50px;right:8px;width:150px}
 #map{width:150px;height:84px}
 #navT{padding:4px 7px;gap:6px}
 #navI{width:28px;height:28px}
 #navA{font-size:15px}
 #navD{font-size:11px}
 #acts{right:10px;bottom:10px;gap:10px}
 .act{width:78px;height:78px}
 .act b{font-size:16px}
 .act span{font-size:12px}
 #joy{width:116px;height:116px;left:14px;bottom:12px}
 #knob{width:46px;height:46px;margin:-23px 0 0 -23px}
 #joyT{top:-20px;font-size:12px}
 #warn{top:22%;font-size:24px}
 #seg{top:34%}
 #seg b{font-size:24px}
 #seg span{font-size:14px;max-width:420px}
}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="nav" aria-label="導航與小地圖"><canvas id="map"></canvas><div id="navT"><svg id="navI" viewBox="0 0 40 40" aria-hidden="true"></svg><div><b id="navA">出發</b><span id="navD">沿藍線前進</span></div></div></div>
  <div id="marks" class="hud" style="inset:0"></div>
  <div id="tl" class="hud">
    <div class="row"><span id="dist">距離前線陣地</span></div>
    <div class="row"><div class="track pg"><b id="prog"></b></div></div>
    <div id="mems"><span>尖兵</span><div class="track"><b id="mb0"></b></div><span>機槍手</span><div class="track"><b id="mb1"></b></div><span>通信兵</span><div class="track"><b id="mb2"></b></div><span>火箭手</span><div class="track"><b id="mb3"></b></div></div>
    <div class="row" id="recB" hidden><span>被偵察</span><div class="track rc"><b id="recF"></b></div></div>
    <div class="row"><span id="cov">位置：空地</span></div>
  </div>
  <button id="pauseB" type="button">暫停</button>
  <button id="skipB" type="button" hidden>跳過</button>
  <div id="warn" class="hud"></div>
  <div id="seg" class="hud" hidden><b id="segT"></b><span id="segS"></span></div>
  <div id="legend" class="hud"><span><i style="color:var(--amber)">黃圈→紅圈</i>　無人機：閃開、干擾或開槍</span><span><i>虛線框「光纖」</i>　干擾不了，只能開槍或閃</span><span><i style="color:var(--orange)">橘圈</i>　砲擊：離開或躲掩蔽</span><span><i style="color:var(--red)">紅色光帶</i>　直升機：離開或躲掩蔽</span><span><i>白色大圈</i>　偵察無人機：躲進室內</span></div>
  <div id="acts"><button id="sgB" class="act" type="button" aria-label="散彈槍"><b>散彈槍</b><span id="sgS">就緒</span><i class="kb">空白鍵</i></button><button id="jamB" class="act" type="button" aria-label="干擾器"><b>干擾器</b><span id="jamS">就緒</span><i class="kb">J 鍵</i></button></div>
  <div id="joyZone" aria-label="移動區：按住左半邊任一處拖曳"></div>
  <div id="joy" aria-hidden="true"><div id="joyT">移動</div><div id="knob"></div></div>
  <div id="ov" class="ov"><div id="card" class="card" role="dialog" aria-modal="true"></div></div>
  <div id="err" hidden>畫面載入失敗。請改用手機內建的 Chrome 或 Safari 開啟，或稍後再試。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').hidden=false;return}
let R;try{R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});}catch(e){$('err').hidden=false;return}
const coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
R.setPixelRatio(Math.min(window.devicePixelRatio||1,coarse?1.6:2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
const V=THREE.Vector3,PI=Math.PI;
const S=new THREE.Scene();const FOG=0x06080b;S.background=new THREE.Color(FOG);S.fog=new THREE.Fog(FOG,38,115);
const cam=new THREE.PerspectiveCamera(42,16/9,.5,500);

/* ---------- 工具 ---------- */
let seed=11;function srnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function sr(a,b){return a+srnd()*(b-a)}
function rnd(a,b){return a+Math.random()*(b-a)}
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function speck(g,w,h,n,a){for(let i=0;i<n;i++){const v=Math.random()<.5?0:255;g.fillStyle='rgba('+v+','+v+','+v+','+(a*Math.random())+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}}
function fixUV(geo,dims,k){const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++){let su=k,sv=k;if(dims){const f=Math.floor(i/4);const d=f<2?[dims[2],dims[1]]:(f<4?[dims[0],dims[2]]:[dims[0],dims[1]]);su=d[0]*k;sv=d[1]*k}uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv)}uv.needsUpdate=true;return geo}
function box(w,h,d,k){return fixUV(new THREE.BoxGeometry(w,h,d),[w,h,d],k||.3)}
function merge(list){let n=0,ni=0;list.forEach(g=>{n+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count});const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2),idx=new Uint32Array(ni);let o=0,oi=0;list.forEach(g=>{const c=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);if(g.index){const ia=g.index.array;for(let i=0;i<ia.length;i++)idx[oi+i]=ia[i]+o;oi+=ia.length}else{for(let i=0;i<c;i++)idx[oi+i]=o+i;oi+=c}o+=c});const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(pos,3));G.setAttribute('normal',new THREE.BufferAttribute(nor,3));G.setAttribute('uv',new THREE.BufferAttribute(uv,2));G.setIndex(new THREE.BufferAttribute(idx,1));G.computeBoundingSphere();return G}
const std=o=>new THREE.MeshStandardMaterial(o);
function radial(stops,size){return tex(size||64,size||64,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h)})}
const glowTex=radial([[0,'rgba(255,255,255,1)'],[.25,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
const poolTex=radial([[0,'rgba(255,214,150,.55)'],[.5,'rgba(255,190,110,.2)'],[1,'rgba(255,180,90,0)']],128);
const fireTex=radial([[0,'rgba(255,252,225,1)'],[.3,'rgba(255,190,80,.95)'],[.62,'rgba(220,80,20,.5)'],[1,'rgba(0,0,0,0)']]);
const smokeTex=tex(64,64,(g,w,h)=>{for(let i=0;i<9;i++){const x=rnd(18,46),y=rnd(18,46),r=rnd(10,18);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}});

/* ---------- 材質 ---------- */
const wetAsph=tex(512,512,(g,w,h)=>{g.fillStyle='#1b1e25';g.fillRect(0,0,w,h);speck(g,w,h,40000,.18);g.fillStyle='rgba(60,70,90,.25)';for(let i=0;i<14;i++){g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(15,45),rnd(8,22),rnd(0,3),0,7);g.fill()}},[4,4]);
const tileT=tex(256,256,(g,w,h)=>{g.fillStyle='#3a3f48';g.fillRect(0,0,w,h);speck(g,w,h,9000,.18);g.strokeStyle='rgba(15,18,22,.6)';for(let i=0;i<=8;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(w,i*32);g.stroke();g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,h);g.stroke()}});
const fieldT=tex(256,256,(g,w,h)=>{g.fillStyle='#1f2618';g.fillRect(0,0,w,h);for(let i=0;i<4000;i++){const v=rnd(-12,12);g.fillStyle='rgba('+(40+v)+','+(52+v)+','+(30+v)+',.6)';g.fillRect(rnd(0,w),rnd(0,h),2,3)}g.fillStyle='rgba(50,40,28,.4)';for(let i=0;i<14;i++){g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(8,30),0,7);g.fill()}},[30,30]);
const mudT=tex(256,256,(g,w,h)=>{g.fillStyle='#2e271f';g.fillRect(0,0,w,h);speck(g,w,h,12000,.22);g.fillStyle='rgba(70,80,95,.25)';for(let i=0;i<10;i++){g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(10,30),rnd(5,14),rnd(0,3),0,7);g.fill()}});
function blobs(g,w,h,n,r0,r1,col,a0,a1){for(let i=0;i<n;i++){const x=srnd()*w,y=srnd()*h,r=sr(r0,r1);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',sr(a0,a1).toFixed(3)));gr.addColorStop(1,col.replace('A','0'));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}}
